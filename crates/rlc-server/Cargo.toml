[package]
name = "rlc-server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
axum = { version = "0.8.9", features = ["ws"] }
dirs = "7.0.0"
local-ip-address = "0.6.13"
rlc-core = { version = "0.1.0", path = "../rlc-core" }
rlc-dmx = { version = "0.1.0", path = "../rlc-dmx" }
rlc-engine = { version = "0.1.0", path = "../rlc-engine" }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
